{% extends "base.html" %}

{% block title %}Вхід у систему{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="card-title mb-0">Форма входу</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('users.login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username (Ім'я користувача)</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Введіть username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Введіть пароль" required>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Увійти</button>
                    </div>
                </form>

                <div class="alert alert-light border mt-4 mb-0 text-muted small">
                    <div class="fw-bold mb-1">💡 Тестові облікові дані (заглушки):</div>
                    <ul class="mb-0 ps-3">
                        <li>Username: <code>admin</code> | Пароль: <code>admin123</code></li>
                        <li>Username: <code>student</code> | Пароль: <code>pass123</code></li>
                        <li>Username: <code>user</code> | Пароль: <code>password</code></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
