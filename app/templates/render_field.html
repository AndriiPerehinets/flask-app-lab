{% macro render_field(field) %}
  <dt>{{ field.label }}</dt>
  {% if field.errors %}
    <dd>{{ field(class="form-control is-invalid", **kwargs) | safe }}
    <ul class="list-group mt-1">
      {% for error in field.errors %}
        <li class="list-group-item list-group-item-danger py-1">{{ error }}</li>
      {% endfor %}
    </ul>
    </dd>
  {% else %}
    <dd>{{ field(class="form-control", **kwargs) | safe }}</dd>
    <br>
  {% endif %}
{% endmacro %}
