{% extends "base.html" %}

{% block title %}Account{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
        <h2 class="mb-2">Welcome, {{ user.username }}!</h2>
        <p class="text-muted mb-1">You have successfully logged in to your profile.</p>
        <p class="mb-4"><strong>Email:</strong> {{ user.email }}</p>
        <div>
            <a href="{{ url_for('users.logout') }}" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
    </div>
</div>
{% endblock %}
